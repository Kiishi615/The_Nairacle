[logging]
level = 10
log_dir = logs/dev

[model]
chat_model = anthropic:claude-haiku-4-5
embedding_model = text-embedding-3-small
opus_model = claude-opus-4-7-20250619
opus_thinking_budget = 10000

[agent]
use_reranker = true
pinecone_top_k = 50
reranker_top_k = 5
tavily_max_results = 5
tavily_research_poll_interval = 10
tavily_research_max_wait = 120
context_window_size = 8
summary_trigger = 8
# reranker | chronological | hybrid
retrieval_strategy = hybrid
default_cutoff_months = 6
